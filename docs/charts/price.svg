<svg xmlns='http://www.w3.org/2000/svg' class='ch' viewBox='0 0 760 308' width='100%' role='img' aria-labelledby='t d'><title id='t'>Electricity price slider</title><desc id='d'>At €0.30/kWh the job's electricity costs €0.014; APIs: DeepSeek API, peak €0.062, DeepSeek API, off-peak €0.031, Wafer €0.021, DeepInfra €0.015. At €0.05/kWh (solar surplus) it is €0.0024.</desc><style>svg.ch{--ink:#1e1e1e;--ink2:#4a4a48;--muted:#76767a;--grid:#ececea;--axis:#c9c8c2;--surf:#ffffff;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--neutral:#a3a29c;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-variant-numeric:tabular-nums}@media (prefers-color-scheme: dark){svg.ch{--ink:#e4e4e5;--ink2:#c3c3c4;--muted:#9b9c9d;--grid:#2e2f32;--axis:#4a4b4f;--surf:#1d1e20;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--neutral:#77767c}}[data-theme=dark] svg.ch,body.dark svg.ch{--ink:#e4e4e5;--ink2:#c3c3c4;--muted:#9b9c9d;--grid:#2e2f32;--axis:#4a4b4f;--surf:#1d1e20;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--neutral:#77767c}[data-theme=light] svg.ch{--ink:#1e1e1e;--ink2:#4a4a48;--muted:#76767a;--grid:#ececea;--axis:#c9c8c2;--surf:#ffffff;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--neutral:#a3a29c}svg.ch text{dominant-baseline:auto}</style><g transform='translate(8,0)'><text x='0.0' y='20.0' font-size='15' fill='var(--ink)' text-anchor='start' font-weight='600'>Cost of the 500-question job</text><text x='0.0' y='39.0' font-size='12' fill='var(--ink2)' text-anchor='start' font-weight='normal'>drag to set the electricity price</text><line x1='186' x2='674' y1='78' y2='78' stroke='var(--grid)' stroke-width='4' stroke-linecap='round'/><line x1='186.0' x2='186.0' y1='84' y2='89' stroke='var(--muted)'/><text x='186.0' y='102.0' font-size='11' fill='var(--muted)' text-anchor='middle' font-weight='normal'>€0</text><line x1='234.8' x2='234.8' y1='84' y2='89' stroke='var(--muted)'/><text x='234.8' y='102.0' font-size='11' fill='var(--muted)' text-anchor='middle' font-weight='normal'>solar surplus</text><line x1='478.8' x2='478.8' y1='84' y2='89' stroke='var(--muted)'/><text x='478.8' y='102.0' font-size='11' fill='var(--muted)' text-anchor='middle' font-weight='normal'>typical tariff</text><line x1='674.0' x2='674.0' y1='84' y2='89' stroke='var(--muted)'/><text x='674.0' y='102.0' font-size='11' fill='var(--muted)' text-anchor='middle' font-weight='normal'>€0.50</text><text x='174.0' y='82.0' font-size='12' fill='var(--ink)' text-anchor='end' font-weight='normal'>electricity</text><circle class='pk' cx='478.8' cy='78' r='9' fill='var(--s1)' stroke='var(--surf)' stroke-width='2' style='cursor:grab'/><text class='pl' x='478.8' y='62.0' font-size='11' fill='var(--ink)' text-anchor='middle' font-weight='600'>€0.30/kWh</text><rect class='pz' x='174' y='62' width='512' height='32' fill='transparent' style='cursor:pointer'/><text x='174.0' y='143.0' font-size='12' fill='var(--ink)' text-anchor='end' font-weight='600'>This box (electricity)</text><rect class="lb" x='186' y='128' width='100.4' height='20' rx='3' fill='var(--s1)'/><text class='lv' x='292.4' y='143.0' font-size='12' fill='var(--ink)' text-anchor='start' font-weight='600'>€0.014</text><text x='174.0' y='171.0' font-size='12' fill='var(--ink)' text-anchor='end' font-weight='normal'>DeepSeek API, peak</text><rect x='186' y='156' width='432.2' height='20' rx='3' fill='var(--neutral)'/><text x='624.2' y='171.0' font-size='12' fill='var(--ink)' text-anchor='start' font-weight='normal'>€0.062</text><text x='174.0' y='199.0' font-size='12' fill='var(--ink)' text-anchor='end' font-weight='normal'>DeepSeek API, off-peak</text><rect x='186' y='184' width='216.1' height='20' rx='3' fill='var(--neutral)'/><text x='408.1' y='199.0' font-size='12' fill='var(--ink)' text-anchor='start' font-weight='normal'>€0.031</text><text x='174.0' y='227.0' font-size='12' fill='var(--ink)' text-anchor='end' font-weight='normal'>Wafer</text><rect x='186' y='212' width='146.4' height='20' rx='3' fill='var(--neutral)'/><text x='338.4' y='227.0' font-size='12' fill='var(--ink)' text-anchor='start' font-weight='normal'>€0.021</text><text x='174.0' y='255.0' font-size='12' fill='var(--ink)' text-anchor='end' font-weight='normal'>DeepInfra</text><rect x='186' y='240' width='104.6' height='20' rx='3' fill='var(--neutral)'/><text x='296.6' y='255.0' font-size='12' fill='var(--ink)' text-anchor='start' font-weight='normal'>€0.015</text><text x='0.0' y='296.0' font-size='11' fill='var(--muted)' text-anchor='start' font-weight='normal'>Electricity only: 0.048 kWh measured (GPUs and CPU), no hardware. API prices as billed on 16 Nov 2026.</text><script><![CDATA[(function(){var KWH=0.048,PMAX=0.5,SX0=186,SX1=674,L=186,X1=674,VMAX=0.07;
var s=document.currentScript.closest('svg'),q=function(c){return s.querySelector('.'+c)},drag=false;
function set(e){var r=s.getBoundingClientRect(),vb=s.viewBox.baseVal,x=(e.clientX-r.left)*vb.width/r.width-8;
 var p=Math.max(0,Math.min(PMAX,(x-SX0)/(SX1-SX0)*PMAX));p=Math.round(p*100)/100;var sx=SX0+p/PMAX*(SX1-SX0);
 q('pk').setAttribute('cx',sx);var pl=q('pl');pl.setAttribute('x',sx);pl.textContent='\u20ac'+p.toFixed(2)+'/kWh';
 var v=KWH*p,bx=L+Math.min(v,VMAX)/VMAX*(X1-L);q('lb').setAttribute('width',Math.max(bx-L,1));
 var lv=q('lv');lv.setAttribute('x',bx+6);lv.textContent='\u20ac'+v.toFixed(3)}
var z=q('pz'),k=q('pk');[z,k].forEach(function(el){el.addEventListener('pointerdown',function(e){drag=true;
 try{el.setPointerCapture(e.pointerId)}catch(_){};set(e)});el.addEventListener('pointermove',function(e){if(drag)set(e)});
 el.addEventListener('pointerup',function(){drag=false})});})();]]></script></g></svg>
